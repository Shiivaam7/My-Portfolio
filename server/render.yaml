services:
  - type: web
    name: shiko-portfolio-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: CONTACT_TO_EMAIL
        value: shivamraj0k0r@gmail.com
      - key: MAIL_FROM_NAME
        value: Shivam Kumar Portfolio
